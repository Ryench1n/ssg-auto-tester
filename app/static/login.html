<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нэвтрэх · SSG Auto Tester</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<style>
  :root { --bg:#f4f6fa; --card:#fff; --ink:#1a202c; --muted:#64748b; --line:#e2e8f0; --brand:#1f4e8c; --fail:#c0392b; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; font:14px/1.45 "Segoe UI", Arial, sans-serif;
         background:var(--bg); color:var(--ink); }
  header { background:var(--brand); color:#fff; padding:14px 24px; }
  header h1 { font-size:18px; margin:0; letter-spacing:.3px; }
  main { flex:1; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .card { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:24px; }
  .card h2 { font-size:17px; margin:0 0 4px; color:var(--brand); }
  .card p { margin:0 0 18px; color:var(--muted); font-size:13px; }
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  input:focus { outline:2px solid var(--brand); outline-offset:-1px; border-color:var(--brand); }
  .btn { width:100%; margin-top:20px; background:var(--brand); color:#fff; border:0; padding:11px 18px; border-radius:7px;
         font:inherit; font-weight:600; cursor:pointer; }
  .btn:disabled { opacity:.6; cursor:default; }
  .err { margin-top:14px; padding:9px 12px; border-radius:7px; background:#fdecea; color:#8b1d13; font-size:13px; }
  .hidden { display:none; }
</style>
</head>
<body>
<header><h1>SSG Auto Tester</h1></header>
<main>
  <form class="card" id="f" autocomplete="on">
    <h2>Нэвтрэх</h2>
    <p>Тест эхлүүлж, өөрийн түүхээ харахын тулд нэвтэрнэ үү.</p>
    <label for="u">Нэвтрэх нэр</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="p">Нууц үг</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button class="btn" id="b" type="submit">Нэвтрэх</button>
    <div class="err hidden" id="e" role="alert"></div>
  </form>
</main>
<script>
const $ = (id) => document.getElementById(id);
$('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  $('b').disabled = true; $('e').classList.add('hidden');
  try {
    const r = await fetch('/api/auth/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: $('u').value, password: $('p').value})});
    if (r.ok) { location.replace('/'); return; }
    const d = await r.json().catch(() => ({}));
    $('e').textContent = d.detail || 'Нэвтэрч чадсангүй';
  } catch (e) {
    $('e').textContent = 'Сервертэй холбогдож чадсангүй';
  }
  $('e').classList.remove('hidden'); $('b').disabled = false; $('p').select();
});
</script>
</body>
</html>
