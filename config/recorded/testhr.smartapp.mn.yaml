# UI-аас бичсэн урсгалууд (SSG Auto Tester → «Урсгал бичих»). Гараар засаж болно.
flows:
  'rec: Тогтмол ажил':
    description: Бичсэн урсгал (11 алхам)
    recorded: true
    steps:
    - uses: ui.menu
      name: «Тогтмол ажил» цэс нээх
      with:
        menu: Мастер дата||Тогтмол ажил|regularactivitypropertylist
    - uses: ui.click
      name: «Шинэ» дарах
      with:
        button: Шинэ
        scope: page
    - uses: ui.fill
      name: «Код» бөглөх
      with:
        field: Код
        value: '{run_tag}1'
    - uses: ui.fill
      name: «Нэр» бөглөх
      with:
        field: Нэр
        value: '{run_tag} one'
    - uses: ui.pick
      name: «Харъяалагдах бүлэг» lookup-оос сонгох
      with:
        field: Харъяалагдах бүлэг
        row: 1 Бүх
    - uses: ui.fill
      name: «Тайлбар» бөглөх
      with:
        field: Тайлбар
        value: '{run_tag} one'
    - uses: ui.click
      name: «Хадгалах & Гарах» дарах
      with:
        button: Хадгалах & Гарах
        scope: dialog
    - uses: ui.search
      name: Хайх
      with:
        text: '{run_tag} one'
    - uses: ui.click
      name: «Устгах» дарах
      with:
        button: Устгах
        scope: page
    - uses: ui.click
      name: «Тийм» дарах
      with:
        button: Тийм
        scope: dialog
    - uses: ui.click
      name: «Сэргээх» дарах
      with:
        button: Сэргээх
        scope: page
    code: R01
