# testaccounting.smartapp.mn — ~970 цэсийн гар smoke тестээс сурсан тохиргоо
risky_items: ["динамик тайлан", "Робот (RPA)"]
skip_items: []
priority:
  critical_items: ["Нүүр хуудас"]

# Component-based E2E урсгалууд — UI-ын «CRUD урсгал» карт эсвэл
#   python -m app.flows --url ... --flow <нэр>
# Нэвтрэлт ЗӨВХӨН гараар (нээгдсэн хөтөч дээр); `role` нь зөвхөн мэдээллийн чанартай.
# code: TC-FLOW-<code>-<№> (заагаагүй бол нэрийн эхний үсгүүд: customer_group_crud → CGC)
# ⚠ Формын талбарын нэрс ("Код", "Нэр") бодит сайт дээр анх ажиллуулахдаа баталгаажуулна.
flows:
  customer_group_crud:
    steps:
      - uses: auth.login
        name: "Admin нэвтрэх"
        with: {role: admin}
      - uses: auth.expect_access
        name: "Харилцагчийн бүлэг цэсэд хандах"
        with: {menu: "Мастер дата / Өглөг авлага / Харилцагчийн бүлэг", allowed: true}
      - uses: crud.create
        name: "Харилцагчийн бүлэг бүртгэх"
        with:
          menu: "Мастер дата / Өглөг авлага / Харилцагчийн бүлэг"
          fields: {"Код": "{run_tag}", "Нэр": "{run_tag} Тест бүлэг"}
          key: "Нэр"
          save_as: group_name
      - uses: crud.search
        name: "Бүртгэснээ хайж олох"
        with: {text: "{group_name}"}
      - uses: crud.update
        name: "Нэрийг засах"
        with:
          find: "{group_name}"
          fields: {"Нэр": "{run_tag} Засварласан бүлэг"}
          key: "Нэр"
          save_as: group_name
      - uses: crud.search
        name: "Засварыг шалгах"
        with: {text: "{group_name}"}
      - uses: crud.delete
        name: "Цэвэрлэх (устгах)"
        always: true
        with: {find: "{group_name}"}
      - uses: crud.search
        name: "Устгагдсаныг шалгах"
        with: {text: "{group_name}", expect: absent}

  # ---------------------------------------------------------------- Үе 1: Гүйлгээ → Дансны үлдэгдэл (Δ)
  # Бие даасан: тест өөрийн хоёр дансыг ({run_tag}01 — дебет, {run_tag}02 — кредит) үүсгэж, тэдгээр дээр 1₮-ийн
  # гүйлгээ хийнэ, Δ-г шалгаад гүйлгээ ба дансуудыг устгана. Бодит дансанд хүрэхгүй; тохиргоо шаардлагагүй.
  # Дансны төрөл: «Туслахтай» (туслах бүртгэл) төрлөөр мөрийн дүн бүртгэгдээгүй («Нийт дүн 0…»), «НӨАТ-ын авлага»
  # «НӨАТ-ын үзүүлэлт оруулна уу!» шаардсан; зардлын төрөл (7001) «кредит бичилт хийх тохиргоо хийгдээгүй» (2026-10-19)
  # — дебет данс: энгийн зардлын төрөл, кредит данс: энгийн орлогын төрөл.
  "P1: Гүйлгээ → Дансны үлдэгдэл":
    type: e2e
    code: P1
    description: "Тест данс ×2 → ГД-ийн гүйлгээ (1₮) → «Данс» жагсаалтын үлдэгдэл Δ (+1 / −1) → гүйлгээ устгахад Δ = 0 → данс устгах"
    steps:
      - uses: crud.auto_create
        name: "Тест данс үүсгэх (дебет)"
        with: {menu: "Мастер дата|Ерөнхий дэвтэр|Данс|accountlist", save_as: d01_rec, field_as: d01_field, try_as: d01_try,
               prefer: {"Дансны төрөл": "зардал&!Туслахтай&!татвар&!НӨАТ"}}   # энгийн зардлын төрөл (доор)
      - uses: crud.auto_create
        name: "Тест данс үүсгэх (кредит)"
        with: {menu: "Мастер дата|Ерөнхий дэвтэр|Данс|accountlist", save_as: c02_rec, field_as: c02_field, try_as: c02_try,
               prefer: {"Дансны төрөл": "орлого&!Туслахтай&!татвар&!НӨАТ"}}   # кредит — орлогын төрөл (доор)
      - &acc
        uses: report.read
        name: "Дансны үлдэгдэл (ГД-ийн бичилт) — эхний төлөв"
        with: &accw
          # «Данс» жагсаалтын «Үлдэгдэл» нь хадгалсан утга — гүйлгээний дараа шинэчлэгдээгүй (2026-10-19). ГД-ийн
          # бичилтийн жагсаалтаас тест дансны Σ Дебет − Σ Кредит (шинэ данс тул яг үлдэгдэл) — шууд бүртгэл.
          menu: "Ерөнхий дэвтэр|Жагсаалт|Гүйлгээний жагсаалт|generalledger/journallist"
          search: true
          rows:
            debit: {match: "{run_tag}01", column: "Дебет", minus: "Кредит", agg: sum}
            credit: {match: "{run_tag}02", column: "Дебет", minus: "Кредит", agg: sum}
          save_as: b0
      - uses: crud.auto_create
        name: "ГД-ийн гүйлгээ: дебет {run_tag}01 / кредит {run_tag}02, 1₮"
        with:
          menu: "Ерөнхий дэвтэр|Жагсаалт|Гүйлгээний жагсаалт|generalledger/journallist"
          save_as: p01_rec
          field_as: p01_field
          try_as: p01_try
          lines: {debit: "{run_tag}01", credit: "{run_tag}02", amount: "1"}
      - uses: crud.search
        name: "Гүйлгээ жагсаалтад харагдах"
        with: {menu: "Ерөнхий дэвтэр|Жагсаалт|Гүйлгээний жагсаалт|generalledger/journallist", text: "{p01_rec}"}
      - <<: *acc
        name: "Дансны үлдэгдэл — гүйлгээний дараа"
        with: {<<: *accw, save_as: b1}
      - uses: assert.delta
        name: "Үлдэгдэл: дебет данс +1, кредит данс −1"
        with: {before: b0, after: b1, expect: {debit: 1, credit: -1}}
      # ---- цэвэрлэгээ (always): гүйлгээ → Δ = 0 → дансууд
      - uses: crud.delete
        name: "Цэвэрлэх: гүйлгээ устгах"
        always: true
        with: {menu: "Ерөнхий дэвтэр|Жагсаалт|Гүйлгээний жагсаалт|generalledger/journallist", find: "{p01_rec}"}
      - <<: *acc
        name: "Дансны үлдэгдэл — гүйлгээ устгасны дараа"
        always: true
        with: {<<: *accw, save_as: b2}
      - uses: assert.delta
        name: "Цэвэрлэгээ: үлдэгдэл анхны төлөвтөө (Δ = 0)"
        always: true
        with: {before: b0, after: b2, expect: {debit: 0, credit: 0}}
      - uses: crud.auto_cleanup
        name: "Цэвэрлэх: гүйлгээний үлдэгдэл"
        always: true
        with: {menu: "Ерөнхий дэвтэр|Жагсаалт|Гүйлгээний жагсаалт|generalledger/journallist", data: p01}
      - uses: crud.auto_cleanup
        name: "Цэвэрлэх: тест данс (дебет)"
        always: true
        with: {menu: "Мастер дата|Ерөнхий дэвтэр|Данс|accountlist", data: d01}
      - uses: crud.auto_cleanup
        name: "Цэвэрлэх: тест данс (кредит)"
        always: true
        with: {menu: "Мастер дата|Ерөнхий дэвтэр|Данс|accountlist", data: c02}

  # ---------------------------------------------------------------- Үе 2: Order-to-Cash (Борлуулалт → Касс)
  # Бие даасан (P1 шиг): тест өөрийн харилцагч ({run_tag}11), үйлчилгээ ({run_tag}12, 1000₮)-г үүсгэж, тэр харилцагчид
  # зээлээр борлуулаад кассын орлогоор төлүүлнэ. Oracle:
  #   - Харилцагчийн «Авлагын үлдэгдэл» (Харилцагч жагсаалт): борлуулалтын дараа +1000, төлбөрийн дараа 0
  #     («Харилцагчийн үлдэгдлийн жагсаалт /дансаар/» өгөгдөл ачаалахад унадаг — 'CustomerGroup' not found,
  #     2026-10-19 — тиймээс oracle биш; төгсгөлд тусдаа шалгалт болгон bug-ийг бүртгэнэ)
  #   - Борлуулалтын жагсаалтын «Нийт дүн» = тоо × үнэ (1 × 1000)
  #   - ГД-ийн бичилт: баримт бүр ГД-д тэнцвэртэй (Σ Дебет = Σ Кредит = 1000) бичигдсэн
  # Цэвэрлэгээ (always): кассын орлого → борлуулалт → (Δ = 0) → бараа → харилцагч. Бодит харилцагч/бараанд хүрэхгүй:
  # run_tag-тай сонголт олдохгүй бол бодит бичлэгээр ОРЛУУЛАХГҮЙ (Blocked).
  "P2: Борлуулалт → Кассын орлого → Авлага":
    type: e2e
    code: P2
    description: "Тест харилцагч + үйлчилгээ → зээлээр борлуулалт (авлага +1000, ГД-д бичигдсэн) → кассын орлого (авлага 0) → цуцлахад Δ = 0"
    steps:
      - uses: crud.auto_create
        name: "Тест харилцагч үүсгэх"
        with: {menu: "Мастер дата|Өглөг авлага|Харилцагч|customerlist", save_as: k11_rec, field_as: k11_field, try_as: k11_try,
               values: {"Борлуулалтын харилцагч эсэх": "true"}}
      - uses: crud.auto_create
        name: "Тест үйлчилгээ (бараа) үүсгэх — 1000₮"
        with: {menu: "Мастер дата|Бараа материал|Барааны жагсаалт|itemlist", save_as: i12_rec, field_as: i12_field, try_as: i12_try,
               # үлдэгдэл, өртөг шаардахгүй; «Төрөл» анхдагч «Бараа материал» (2026-10-19). Данс: бодит борлуулалтын
               # бараа 150101 (Бэлэн бүтээгдэхүүн) — 140101 (Түүхий эд) барааг борлуулахад «Данс сонгогдоогүй» гарсан
               prefer: {"Төрөл": "Ажил үйлчилгээ", "Данс": "1501"},
               values: {"Худалдах үнэ": "1000", "Борлуулах бараа эсэх": "true"}}
      - &ar
        uses: report.read
        name: "Харилцагчийн авлага — эхний төлөв"
        with: &arw
          menu: "Мастер дата|Өглөг авлага|Харилцагч|customerlist"
          search: true
          rows:
            ar: {match: "{run_tag}11", column: "Авлагын үлдэгдэл"}
          save_as: a0
      - &gl
        uses: report.read
        name: "ГД-ийн бичилт (тест баримтууд) — эхний төлөв"
        with: &glw
          menu: "Ерөнхий дэвтэр|Жагсаалт|Гүйлгээний жагсаалт|generalledger/journallist"
          search: true
          rows:
            sale_dt: {match: "{run_tag} S14", column: "Дебет", agg: sum}
            sale_net: {match: "{run_tag} S14", column: "Дебет", minus: "Кредит", agg: sum}
            pay_dt: {match: "{run_tag} R15", column: "Дебет", agg: sum}
            pay_net: {match: "{run_tag} R15", column: "Дебет", minus: "Кредит", agg: sum}
          save_as: g0
      - &sl
        uses: report.read
        name: "Борлуулалтын дүн — эхний төлөв"
        with: &slw
          menu: "Борлуулалт|Жагсаалт|Борлуулалтын жагсаалт|sale/saledocumentlist"
          search: true
          rows:
            total: {match: "{run_tag} S14", column: "Нийт дүн", agg: sum}
          save_as: s0
      - uses: crud.auto_create
        name: "Борлуулалт: тест харилцагчид зээлээр, 1 × 1000₮"
        with:
          menu: "Борлуулалт|Жагсаалт|Борлуулалтын жагсаалт|sale/saledocumentlist"
          save_as: s14_rec
          field_as: s14_field
          try_as: s14_try
          # зээлээр — авлагын данс. «Дансны тохиргоо = Байршил»: борлуулалтын данс байршлаас — эхний «Restaurant»-аар
          # «Данс сонгогдоогүй байна» (2026-10-19); бодит борлуулалтууд «Агуулах» байршилтай
          prefer: {"Харилцагч": "{run_tag}11", "Данс": "авлага&!валют", "Байршил": "Агуулах"}
          lines: {item: "{run_tag}12", cells: {"Тоо хэмжээ": "1", "Нэгж үнэ": "1000"}}
      - uses: crud.search
        name: "Борлуулалт жагсаалтад харагдах"
        with: {menu: "Борлуулалт|Жагсаалт|Борлуулалтын жагсаалт|sale/saledocumentlist", text: "{s14_rec}"}
      - <<: *sl
        name: "Борлуулалтын дүн — бүртгэсний дараа"
        with: {<<: *slw, save_as: s1}
      - uses: assert.delta
        name: "Борлуулалтын нийт дүн = тоо × үнэ (1000)"
        with: {before: s0, after: s1, expect: {total: 1000}}
      - <<: *ar
        name: "Харилцагчийн авлага — борлуулалтын дараа"
        with: {<<: *arw, save_as: a1}
      - uses: assert.delta
        name: "Борлуулалт: харилцагчийн авлага +1000"
        with: {before: a0, after: a1, expect: {ar: 1000}}
      - uses: crud.auto_create
        name: "Кассын орлого: тест харилцагчаас 1000₮"
        with:
          menu: "Мөнгөн хөрөнгө|Жагсаалт|Кассын баримтын жагсаалт|cashflow/cashdocumentlist"
          add_menu: "Кассын орлогын ордер"
          save_as: r15_rec
          field_as: r15_field
          try_as: r15_try
          # «Данс» = КАССЫН данс (дебет): lookup-д зөвхөн 100101 Касс дахь мөнгө /төгрөг/, 100201 /доллар/ … (2026-10-19).
          # Авлагыг кредитлэх (харьцсан) тал формын өөр хэсэгт — survey-гээр тодруулна
          prefer: {"Харилцагч": "{run_tag}11", "Данс": "100101"}
          values: {"Дүн": "1000"}
          survey: true
          lines: {amount: "1000"}
      - uses: doc.number
        name: "Кассын орлогын ордерын дугаар"
        with: {menu: "Мөнгөн хөрөнгө|Жагсаалт|Кассын баримтын жагсаалт|cashflow/cashdocumentlist", find: "{r15_rec}",
               column: "№", save_as: r15_no}
      - uses: report.read
        name: "ГД: кассын орлогын ордерын бичилт (дугаараар)"
        with:
          menu: "Ерөнхий дэвтэр|Жагсаалт|Гүйлгээний жагсаалт|generalledger/journallist"
          search: true
          show_rows: true
          rows:
            pay_no: {match: "{r15_no}", column: "Дебет", agg: sum}
          save_as: g1n
      # ГД-ийг авлагаас ӨМНӨ: авлага хаагдаагүй ч баримт бүр аль дансаар бичигдсэнийг (show_rows) тайланд үлдээнэ
      - <<: *gl
        name: "ГД-ийн бичилт — борлуулалт, төлбөрийн дараа"
        with: {<<: *glw, save_as: g1, show_rows: true}
      - uses: assert.delta
        name: "ГД: баримт бүр 1000₮-өөр тэнцвэртэй бичигдсэн"
        with: {before: g0, after: g1, expect: {sale_dt: 1000, sale_net: 0, pay_dt: 1000, pay_net: 0}}
      - <<: *ar
        name: "Харилцагчийн авлага — төлбөрийн дараа"
        with: {<<: *arw, save_as: a2}
      - uses: assert.delta
        name: "Төлбөр: харилцагчийн авлага хаагдсан (Δ = 0)"
        with: {before: a0, after: a2, expect: {ar: 0}}
      # ---- цэвэрлэгээ (always): урвуу дарааллаар
      - uses: crud.delete
        name: "Цэвэрлэх: кассын орлого устгах"
        always: true
        with: {menu: "Мөнгөн хөрөнгө|Жагсаалт|Кассын баримтын жагсаалт|cashflow/cashdocumentlist", find: "{r15_rec}"}
      - uses: crud.delete
        name: "Цэвэрлэх: борлуулалт устгах"
        always: true
        with: {menu: "Борлуулалт|Жагсаалт|Борлуулалтын жагсаалт|sale/saledocumentlist", find: "{s14_rec}"}
      - <<: *ar
        name: "Харилцагчийн авлага — устгасны дараа"
        always: true
        with: {<<: *arw, save_as: a3}
      - <<: *gl
        name: "ГД-ийн бичилт — устгасны дараа"
        always: true
        with: {<<: *glw, save_as: g2}
      - uses: assert.delta
        name: "Цэвэрлэгээ: авлага анхны төлөвтөө (Δ = 0)"
        always: true
        with: {before: a0, after: a3, expect: {ar: 0}}
      - uses: assert.delta
        name: "Цэвэрлэгээ: ГД-ийн бичилт буцаагдсан (Δ = 0)"
        always: true
        with: {before: g0, after: g2, expect: {sale_dt: 0, sale_net: 0, pay_dt: 0, pay_net: 0}}
      - uses: crud.auto_cleanup
        name: "Цэвэрлэх: кассын орлогын үлдэгдэл"
        always: true
        with: {menu: "Мөнгөн хөрөнгө|Жагсаалт|Кассын баримтын жагсаалт|cashflow/cashdocumentlist", data: r15}
      - uses: crud.auto_cleanup
        name: "Цэвэрлэх: борлуулалтын үлдэгдэл"
        always: true
        with: {menu: "Борлуулалт|Жагсаалт|Борлуулалтын жагсаалт|sale/saledocumentlist", data: s14}
      - uses: crud.auto_cleanup
        name: "Цэвэрлэх: тест үйлчилгээ"
        always: true
        with: {menu: "Мастер дата|Бараа материал|Барааны жагсаалт|itemlist", data: i12}
      - uses: crud.auto_cleanup
        name: "Цэвэрлэх: тест харилцагч"
        always: true
        with: {menu: "Мастер дата|Өглөг авлага|Харилцагч|customerlist", data: k11}
      # Мэдэгдэж буй bug-ийн шалгалт (бусад алхмыг хаахгүйн тулд төгсгөлд): жагсаалт өгөгдлөө ачаалж чадах эсэх
      - uses: report.read
        name: "Харилцагчийн үлдэгдлийн жагсаалт /дансаар/ ачаалагдах"
        always: true
        with:
          menu: "Өглөг & Авлага|Жагсаалт|Харилцагчийн үлдэгдлийн жагсаалт /дансаар/|recpay/customerbalancelist"
          search: true
          rows:
            ar: {match: "{run_tag}11", column: "Эцсийн үлдэгдэл", agg: sum}
          save_as: cb

  # ---------------------------------------------------------------- P2 оношлогоо (ЗӨВХӨН УНШИНА — юу ч хадгалахгүй)
  # Тестийн кассын орлого (КО…) хадгалагдсан ч ГД-д бичилт үүсгээгүй (2026-10-20). Бодит кассын орлогын ордерууд ГД-д
  # бичигддэг эсэх, аль дансаар (харьцсан тал) — жагсаалтуудыг уншиж мөрүүдийг тайланд бичнэ.
  "P2D: Кассын баримтын ГД бичилт (оношлогоо)":
    type: e2e
    code: P2D
    description: "Зөвхөн уншина: бодит кассын орлогын ордерууд Гүйлгээний жагсаалтад (ГД) ямар дансаар бичигдсэнийг тайланд гаргана"
    steps:
      - uses: report.read
        name: "ГД: кассын орлогын ордерын бичилтүүд"
        with:
          menu: "Ерөнхий дэвтэр|Жагсаалт|Гүйлгээний жагсаалт|generalledger/journallist"
          search: true
          show_rows: true
          rows:
            by_type: {match: "Кассын орлогын ордер", column: "Дебет", agg: sum}
            by_no: {match: "КО1", column: "Дебет", agg: sum}
          save_as: d1
      - uses: report.read
        name: "Кассын баримтын жагсаалт: орлогын ордерууд"
        with:
          menu: "Мөнгөн хөрөнгө|Жагсаалт|Кассын баримтын жагсаалт|cashflow/cashdocumentlist"
          search: true
          show_rows: true
          rows:
            by_type: {match: "Кассын орлогын ордер", column: "Дебет", agg: sum}
          save_as: d2

